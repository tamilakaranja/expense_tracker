<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Expense tracker</h1>
    

<!-- input expense tracker  -->
  <div class="main-layout">
    <div class="left-side">

<div class="expense-input"> 
    <input type="text" placeholder="Expense description" id="expense-description">
    <button id="add-expense-btn">Add expense</button>
    <input type="number" placeholder="Amount" id="amount">
    
    
   <select name="Select-category" id="Select-category">
        <option value="food">Food</option>
        <option value="clothes">Clothes</option>
        <option value="groceries">Groceries</option>
        <option value="rent">Rent</option>
        <option value="transport">Transport</option>

        
</select>

  </div>
   <!-- Notes section -->
    <div class="notes">
      <h2>Notes</h2>
      <textarea name="text-area" id="text-area"></textarea>
    </div>
</div>


<!-- expense show plus filter  -->
<div class="right-side">
    
<div class="expense-list" id="categories">
    <h2>Your expenses</h2>
       <select name="filter-category" id="filter-category">
        <option value="food">Food</option>
        <option value="clothes">Clothes</option>
        <option value="groceries">Groceries</option>
        <option value="rent">Rent</option>
        <option value="transport">Transport</option>


</select>
<!-- total expense  -->
  <div class="total-expenses">
<h3>Total expenses</h3>
<p id="total-amount">0</p>
  </div>

</div>

 </div>


<ul id="expense-list"></ul>

</div>



 <script src="script.js"></script>
</body>
</html>
